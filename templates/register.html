{% extends 'base.html' %}{% block title %}Đăng ký — Root{% endblock %}{%
block content %}
<section class="auth-page">
  <form class="auth-box" method="post">
    <span class="eyebrow">Tham gia cộng đồng</span>
    <h1>Tạo tài khoản</h1>
    <p>Lưu lại những bài viết muốn đọc chậm hơn.</p>
    <label class="field"
      >Tên của bạn<input
        type="text"
        required
        name="name" placeholder="Tên hiển thị" /></label
    ><label class="field"
      >Email<input name="email" type="email" required placeholder="ban@example.com" /></label
    ><label class="field"
      >Mật khẩu<input
        name="password" type="password"
        required
        placeholder="Tối thiểu 8 ký tự" /></label
    ><button class="button button-dark" type="submit">Đăng ký</button>
    <a class="button google-button" href="{{ url_for('google_login') }}"><img class="google-logo" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" aria-hidden="true" />Đăng ký bằng Google</a>
    <p class="auth-switch">Đã có tài khoản? <a href="{{ url_for('sign') }}">Đăng nhập</a></p>
  </form>
</section>
{% endblock %}
