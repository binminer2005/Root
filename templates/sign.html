{% extends 'base.html' %}{% block title %}Đăng nhập — Root{% endblock %}{%
block content %}
<section class="auth-page">
  <form class="auth-box" method="post">
    <span class="eyebrow">Chào mừng trở lại</span>
    <h1>Đăng nhập</h1>
    <p>Tiếp tục nhịp đọc của riêng bạn.</p>
    <label class="field"
      >Email<input name="email" type="email" required placeholder="ban@example.com" /></label
    ><label class="field"
      >Mật khẩu<input name="password" type="password" required placeholder="••••••••" /></label
    ><button class="button button-dark" type="submit">Đăng nhập</button>
    <a class="button google-button" href="{{ url_for('google_login') }}"><img class="google-logo" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" aria-hidden="true" />Đăng nhập bằng Google</a>
    <p class="auth-switch">Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký</a></p>
  </form>
</section>
{% endblock %}
